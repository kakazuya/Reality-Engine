      - symbol: NETWEB
        reason: Netweb Technologies supplies data-centre servers and high-performance computing systems.
      - symbol: XTRANET
        reason: Xtranet reports ~48% of Q1 FY27 revenue from data-centre infrastructure and IT operations.
  defence:
