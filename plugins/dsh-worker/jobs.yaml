# dsh-worker data-job registry (Phase 2, tasks/DSH_FLEET_PLAN_2026-10-24.md)
#
# Source of every entry: tasks/DATA_JOBS_AUDIT_2026-10-24.md (job numbers in
# comments).  Every job is disabled: Shivam disabled the scheduled tasks on
# 2026-10-21; re-enable only on his word.  start_job refuses a disabled entry
# unless the caller passes confirm=true (an explicit one-off).
#
# argv[0] "python" is replaced with the MCP server's interpreter.  In argv,
# {date} = today (YYYY-MM-DD), {start} = today-10d, {repo_root}, {data_root}.
# extra start_job(name, args=[...]) entries are appended to argv.
#
# success_check runs as a read-only SQLite query (mode=ro + PRAGMA query_only)
# with a bounded budget.  expect.kind=max_date compares the returned date to
# max_age_days; expect.kind=min_count compares the returned count to min_count.
# A job that exits 0 while writing nothing is therefore still reported stale.
#
# resource_locks are held for the job's lifetime by the supervisor with OS byte
# range locks (db:<filename>, gpu, net:<host>), so two jobs never share one.
schema: dsh-worker-jobs/1
jobs:
  # ---------------------------------------------------------------- market chain
  - name: market_raw_exchange  # audit #1
    description: "Exchange daily files: NSE full/CM-ISIN/indices/SME, BSE bhav+delivery, participant OI+volume, FII stats."
    argv: ["python", "-m", "reality_engine.scripts.fetch_market_raw", "--sources", "nse_full,nse_cm_isin,nse_index,bse_bhav,bse_deliv,nse_part_oi,nse_part_vol,nse_fii_stats", "--start", "{start}", "--end", "{date}"]
    cwd: "."
    env: {}
    writes: ["reality_engine/data/raw_market/"]
    resource_locks: ["net:www.nseindia.com", "net:www.bseindia.com"]
    cadence: daily
    success_check:
      db: equity_intelligence.db
      sql: "SELECT max(date) AS value FROM mkt_nse_full_daily"
      expect: {kind: max_date, max_age_days: 3}
    off_peak_only: false
    market_hours: any
    needs_paid_api: false
    needs_gpu: false
    enabled: false

