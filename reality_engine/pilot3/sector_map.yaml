# Exchange taxonomy (company_industry, joined by ISIN) -> pilot3 lexicon sector (T-094).
# Read by make_profile.py only.  Keep it out of lexicon/: every yaml there is read as a KPI lexicon.
#
# basic_industry is tried first, then industry; a name listed as `unknown` has no lexicon family and
# builds on the common lexicons only, and a name not listed at all is `unknown` too.  This file lists all
# 191 basic industries of company_industry so the gap is visible, not guessed: 47 map to one of
# the 10 families the lexicons carry, 144 are honest unknown.
# Families: bank, nbfc, insurance_life, auto_oem, consumer_internet, fmcg, it_services, metals_nonferrous, epc_capital_goods, pharma.
#
# lender is the taxonomy's own list (Banks, NBFC, Housing Finance, Microfinance, Insurance), independent of
# whether a lexicon family exists (a general insurer is a lender with no sector lexicon).  The second check
# is the filed lines, run on a built database by `make_profile --check-db` (lender.py).
lender_basic_industry:
  - "Private Sector Bank"
  - "Public Sector Bank"
  - "Other Bank"
  - "Non Banking Financial Company (NBFC)"
  - "Housing Finance Company"
  - "Microfinance Institutions"
  - "Financial Institution"
  - "Life Insurance"
  - "General Insurance"
lender_industry:
  - "Banks"

