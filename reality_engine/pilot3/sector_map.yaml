# Second tier, used only when company_industry has no row for the company's ISINs or symbol: master_companies.industry
# is coarse and mostly unusable (of 5,358 active companies 2,688 are null, 1,906 "General Diversified", 269 "Other"),
# so only the names that map cleanly to one family are listed.  An unlisted name stays `unknown`.
# Consumer Durables -> jewellery_lifestyle and Consumer Services -> retail are the two coarse names a pilot company
# actually reaches (TITAN and TRENT; every other consumer company has a basic_industry row first).
master_industry:
  "Capital Goods": epc_capital_goods
  "Construction": epc_capital_goods
  "Fast Moving Consumer Goods": fmcg
  "Information Technology": it_services
  "Construction Materials": cement
  "Consumer Services": retail
  "Consumer Durables": jewellery_lifestyle
  "Healthcare": pharma
  "Textiles": textiles_home
  "Realty": realty
  "Power": utilities_power
  "Telecommunication": telecom
  "Chemicals": paints_chemicals
