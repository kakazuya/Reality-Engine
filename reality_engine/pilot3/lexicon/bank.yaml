# Bank additions (loop 2) beside the shared lenders family. Labels are generic bank words; the `strict` forms used
# in sentences require the value right after the term, so a sentence that names the term but not its number yields
# no row (guidance prose mostly reads "deposit growth to be around ...").
family: bank
sectors: [bank]
entries:
  - {metric: casa_ratio, kind: pct, unit: pct, labels: ["casa ratio", "casa (deposits? )?(as a )?(% of|share|ratio)", "casa\\b[^.]{0,40}?%"], neg: "may|will|expected|protect|come back|decline", strict: ["casa ratio\\s*(?:of|at|was|is|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "casa (?:deposits? )?(?:as a )?(?:% of|share of) (?:total )?deposits[^.]{0,16}?(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: casa, kind: money, unit: inr_cr, labels: ["casa deposits", "\\bcasa\\b(?! ratio)"], neg: "ratio|%\\s*of|growth|approximately", strict: ["casa deposits\\s*(?:were|was|of|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bcasa\\b(?! ratio)\\s*(?:deposits?)?\\s*(?:were|was|of|:)?\\s*(?=₹|`|rs\\.?|inr|\\d+(?:,\\d{3})+)"]}
  - {metric: advances, kind: money, unit: inr_cr, labels: ["gross advances", "net advances", "^advances\\b", "loans? (and|&) advances"], neg: "npa|%|ratio|in rs|thousands|capital assets|for capital"}
  - {metric: loan_growth, kind: pct, unit: pct, labels: ["(loan|advances|credit) growth", "(loans?|advances) (grew|growth|increased)"], neg: "sme|mid-market|wholesale|corporate|overseas|segment|guidance|expect|around|to be|has grown", strict: ["(?:loan|loans|advances|credit) growth\\s*(?:of|at|was|is|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "(?:loans?|advances) (?:grew|growth) (?:by )?(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: deposit_growth, kind: pct, unit: pct, labels: ["deposit growth", "deposits? (grew|increased)"], neg: "to go|expect|likely|guidance|cost|income", strict: ["deposit growth\\s*(?:of|at|was|is|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "deposits? (?:grew|growth) (?:by )?(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: cd_ratio, kind: pct, unit: pct, labels: ["credit[- ]deposit ratio", "\\bcd ratio\\b", "loan[- ]to[- ]deposit"], neg: "range|pre-merger|track|expect|to be|target"}
  - {metric: cet1, kind: pct, unit: pct, labels: ["\\bcet ?1\\b", "common equity tier ?1"], neg: "requirement|minimum|guidance|npa|ratio of|ratio to"}
  - {metric: fee_income, kind: money, unit: inr_cr, labels: ["fees? (and|&) commission", "fee income", "other income[^.]{0,20}?fees"], neg: "%\\s*of|growth|ratio", strict: ["fees? (?:and|&) commissions?\\s*(?:at|of|were|was|:)?\\s*(?=₹|`|rs\\.?|\\d)", "fee income\\s*(?:at|of|were|was|:)?\\s*(?=₹|`|rs\\.?|\\d)"]}
  - {metric: book_value_per_share, kind: money, unit: inr, labels: ["book value per (equity )?share", "\\bbvps\\b"], neg: "growth|%"}
  - {metric: abv, kind: money, unit: inr_cr, labels: ["adjusted book value", "\\babv\\b"], neg: "growth|%|per share"}
  - {metric: unsecured_share, kind: pct, unit: pct, labels: ["unsecured( retail| loans?| advances)?[^.]{0,30}?(%|share|mix)", "share of unsecured"], neg: "stage|floor|recovery|category is|provision|npa", strict: ["unsecured(?: retail| loans?| advances)?[^.]{0,30}?(?=\\d+(?:\\.\\d+)?\\s*%)", "share of unsecured[^.]{0,20}?(?=\\d+(?:\\.\\d+)?\\s*%)"]}
