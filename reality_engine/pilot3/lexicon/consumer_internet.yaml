# Consumer internet / quick-commerce KPI family (loop 2). The shareholder letter reports NOV (net order value)
# from FY27 on and no longer discloses GOV; a metric that only prints as a growth rate stays unmet by design.
family: consumer_internet
sectors: [consumer_internet]
entries:
  - {metric: adjusted_ebitda_margin_of_gov, kind: pct, unit: pct, labels: ["adjusted ebitda[^.]{0,30}?(% of|as a % of|margin)[^.]{0,12}?(gov|gmv)", "adjusted ebitda margin"], neg: "cities|expect|guidance|range|5-6%|ebit margin|revenue", strict: ["adjusted ebitda margin[^.]{0,45}?(?=-?\\d+(?:\\.\\d+)?\\s*%)", "adjusted ebitda[^.]{0,30}?as a % of (?:nov|gmv|gov)[^.]{0,12}?(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: contribution_margin, kind: pct, unit: pct, labels: ["contribution margin", "contribution profit margin", "contribution\\b[^.]{0,20}?% of (gov|gmv)"], neg: "cities|expect|positive", strict: ["contribution margin\\s*(?:of|at|was|:)?\\s*(?=-?\\d+(?:\\.\\d+)?\\s*%)", "contribution profit margin\\s*(?:of|at|:)?\\s*(?=-?\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: gov, kind: money, unit: inr_cr, labels: ["gross order value", "\\bgov\\b"], neg: "margin|% of|growth|governmental|regulatory|approvals", strict: ["gross order value\\s*(?:of|at|stood at|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bgov\\b\\s*(?:of|at|stood at|:)?\\s*(?=₹|`|rs\\.?|inr|\\d+(?:,\\d{3})*)"]}
  - {metric: dark_stores, kind: count, unit: count, labels: ["dark stores?", "stores? (count|network)", "number of (dark )?stores"], neg: "crore|inr|lakh|grew|growth|million|continued|including|healthily", strict: ["dark stores?\\b[^.]{0,36}?(?=\\d{1,5}(?:\\.\\d+)?)", "number of (?:dark )?stores\\s*:?\\s*(?=\\d{1,5})"]}
  - {metric: monthly_transacting_users, kind: count, unit: count_mn, labels: ["monthly transacting (users|customers)", "\\bmtu\\b"], neg: "addition|than|could|whether|growth|top", strict: ["monthly transacting (?:users|customers)[^.]{0,30}?(?=\\d+(?:\\.\\d+)?\\s*(?:million|mn|crore))", "\\bmtu\\b\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*(?:million|mn))"]}
  - {metric: esop_cost, kind: money, unit: inr_cr, labels: ["esop (cost|expenses?)", "employee stock option (cost|expenses?)", "share[- ]based payments?"], neg: "reserve|settlement|fractional|allocated|subsidiar|exercise|payable|remuneration|director|sitting fees", strict: ["share[- ]based payment (?:expense|cost|charge)", "esop (?:cost|expenses?)", "employee stock option (?:cost|expenses?)"]}
  - {metric: cash_balance, kind: money, unit: inr_cr, labels: ["cash balance", "cash and (cash )?equivalents", "cash (and|&) treasury"], neg: "equivalent|acquired|note|amounts|treasury income", strict: ["cash balance\\s*(?:was|is|of|at|stood at|stood|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "cash balance\\s*(?:declined|increased|decreased)"]}
  - {metric: ebitda, kind: money, unit: inr_cr, labels: ["adjusted ebitda(?! margin)", "^ebitda\\b"], neg: "margin|%|loss|losses", strict: ["adjusted ebitda\\s*(?:was|is|of|at|stood at|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "^ebitda\\s*(?:was|is|of|at|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)"]}
