# Printed-results line lexicon (T-057).  Canonical line item -> label patterns, matched against the words a
# results table prints on the left of (or in the middle of) a row.  A pattern is a phrase, lower case, matched
# as a substring of the normalised label first and by token similarity second, so an OCR-noisy label still
# resolves.  The longest matching pattern wins, so "profit before exceptional items and tax" beats "before tax".
# No company names: the words below are the ones every Indian results table prints (A5).
#
# The canonical names are the ones stores.QUARTER_TAGS / EXTRA_QUARTER_TAGS / BANK_TAGS / LIFE_TAGS write, so a
# printed line and its XBRL line are the same key in ratios.py and pilot3_fin.
revenue_from_operations:
  - revenue from operations
  - revenue from operation
  - total revenue from operations
  - revenues from operations
  - income from operations
  - net revenue from operations
  - revenue from contracts with customers
other_income:
  - other income
total_income:
  - total income
  - total revenue
cost_of_materials:
  - cost of materials consumed
  - cost of raw material consumed
  - cost of materials
employee_cost:
