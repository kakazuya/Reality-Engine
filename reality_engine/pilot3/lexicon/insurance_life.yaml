# Life insurer KPI family (loop 2). Generic words of the sector, no company names. Decks print year-to-date figures
# under a half-year heading: the period comes from the heading (extractor), never assumed to be the quarter.
# `labels` read a table row; `strict` labels are used in sentences only and require the value right after the term,
# so a heading or a growth sentence yields no row.
family: insurance_life
sectors: [insurance_life]
entries:
  - {metric: vnb_margin, kind: pct, unit: pct, labels: ["vo?nb margin", "value of new business margin", "new business margin"], neg: "cagr|growth|bps|margin analysis", strict: ["vo?nb margin\\s*(?:stands at|at|of|was|is|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "value of new business margin\\s*(?:of|at|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "new business margin\\s*(?:of|at|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: vnb, kind: money, unit: inr_cr, labels: ["value of new business(?! margin)", "\\bvonb\\b(?! margin)", "\\bvnb\\b(?! margin)"], neg: "margin|growth|%|per share", strict: ["value of new business\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bvonb\\b\\)?\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bvnb\\b\\)?\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)"]}
  - {metric: ape, kind: money, unit: inr_cr, labels: ["annuali[sz]ed premium equivalent", "\\bape\\b"], neg: "margin|growth|%\\s*of|mix", strict: ["annuali[sz]ed premium equivalent\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bape\\b\\)?\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)"]}
  - {metric: embedded_value, kind: money, unit: inr_cr, labels: ["embedded value", "\\biev\\b", "\\bev\\b"], neg: "return|roev|growth|operating variance|per share", strict: ["embedded value\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\biev\\b\\)?\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bev\\b\\)?\\s*(?:stands at|of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)"]}
  - {metric: roev, kind: pct, unit: pct, labels: ["return on embedded value", "\\broev\\b"], neg: "growth"}
  - {metric: persistency_13m, kind: pct, unit: pct, labels: ["13th month( persistency)?", "persistency[^.]{0,20}?13th month", "13m persistency"], neg: "unfair|practice|complaint|basis|regular premium|agency", strict: ["13th month(?: persistency)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "13m persistency\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: persistency_25m, kind: pct, unit: pct, labels: ["25th month( persistency)?", "persistency[^.]{0,20}?25th month"], neg: "unfair|practice|complaint|basis|regular premium|agency", strict: ["25th month(?: persistency)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "25m persistency\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: persistency_37m, kind: pct, unit: pct, labels: ["37th month( persistency)?", "persistency[^.]{0,20}?37th month"], neg: "unfair|practice|complaint|basis|regular premium|agency", strict: ["37th month(?: persistency)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "37m persistency\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: persistency_49m, kind: pct, unit: pct, labels: ["49th month( persistency)?", "persistency[^.]{0,20}?49th month"], neg: "unfair|practice|complaint|basis|regular premium|agency", strict: ["49th month(?: persistency)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "49m persistency\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: persistency_61m, kind: pct, unit: pct, labels: ["61st month( persistency)?", "persistency[^.]{0,20}?61st month", "61m persistency"], neg: "unfair|practice|complaint|basis|regular premium|agency", strict: ["61st month(?: persistency)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "61m persistency\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: solvency_ratio, kind: num, unit: x, labels: ["solvency ratio", "solvency margin"], neg: "service|required|minimum|economic|amount|specified|regulatory", strict: ["solvency ratio\\s*(?:of|at|:)?\\s*(?=\\d+\\.\\d+)", "solvency margin\\s*(?:of|at|:)?\\s*(?=\\d+\\.\\d+)"]}
  - {metric: opex_ratio, kind: pct, unit: pct, labels: ["operating expense ratio", "opex ratio", "expenses? management ratio", "total expense ratio"], neg: "growth|bps", strict: ["operating expense ratio\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "opex ratio\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "expenses? management ratio\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: commission_ratio, kind: pct, unit: pct, labels: ["commission ratio", "commission (expenses )?to (gross )?(written )?premium"], neg: "growth|bps", strict: ["commission ratio\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "commission (?:expenses? )?to (?:gross )?(?:written )?premium[^.]{0,20}?(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: banca_share, kind: pct, unit: pct, labels: ["bancassurance( channel)?", "\\bbanca\\b"], neg: "growth", strict: ["bancassurance(?: channel)?(?: share| mix)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)", "\\bbanca\\b(?: share| mix)?\\s*:?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: market_share, kind: pct, unit: pct, labels: ["market share"], neg: "target|guidance|previous", strict: ["market share\\s*(?:of|at|was|stands at|:)?\\s*(?=\\d+(?:\\.\\d+)?\\s*%)"]}
  - {metric: gwp, kind: money, unit: inr_cr, labels: ["gross written premium", "\\bgwp\\b"], neg: "growth|%\\s*of", strict: ["gross written premium\\s*(?:of|at|was|stands at|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)", "\\bgwp\\b\\s*(?:of|at|was|stands at|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)"]}
  - {metric: new_business_premium, kind: money, unit: inr_cr, labels: ["new business premium"], neg: "growth|%\\s*of|assets|aum|inforce|lives|market share", strict: ["new business premium\\s*(?:of|at|was|:)?\\s*(?=₹|`|rs\\.?|inr|\\d)"]}
