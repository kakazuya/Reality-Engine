# code-intel: insert block for @deepseek-ai/dsh-mcp-client (both dsh profiles).
#
# Merge this entry into the `- insert:` list of
#   ~/.dsh/profiles/headless/cordis.patch.yml
#   ~/.dsh/profiles/web/cordis.patch.yml
# directly after the existing `mcp-reality-data` entry (same file, same list,
# same shape).  Keep the list order: `insert:` is a single YAML array under one
# top-level `- insert:` key, so this block is a list item, not a new `- insert:`.
#
# Tool names after restart: mcp__code-intel__definition, __references, __callers,
# __symbols, __hover, __diagnostics, __module_map.
- id: mcp-code-intel
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: code-intel
    transport: stdio
    command: C:/Users/warri/AppData/Local/Programs/Python/Python314/python.exe
    args:
      - C:/Users/warri/Downloads/Info_Diffusion_Model/plugins/code-intel/server/server.py
    cwd: C:/Users/warri/Downloads/Info_Diffusion_Model
    env:
      CODE_INTEL_REPO_ROOT: C:/Users/warri/Downloads/Info_Diffusion_Model
      PYTHONUTF8: "1"
    toolCallTimeoutMs: 60000
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 30000
      maxAttempts: 40
